name: infra

# Static checks for the Terraform module, the Packer template and the shell scripts.
on:
  push:
    branches: [main]
    paths: ["terraform/**", "examples/**", "image/**", "scripts/**", ".github/workflows/**"]
  pull_request:
    paths: ["terraform/**", "examples/**", "image/**", "scripts/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: terraform fmt -check -recursive -diff
      - name: validate module
        working-directory: terraform
        run: terraform init -backend=false -input=false && terraform validate
      - name: validate examples/basic
        working-directory: examples/basic
        run: terraform init -backend=false -input=false && terraform validate

  packer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # v3.4.0
      - run: packer init image
      - run: packer fmt -check -diff image
      - name: packer validate (base only, and with the example hooks)
        run: |
          packer validate -var project_id=validate -var subnetwork=validate image
          packer validate -var project_id=validate -var subnetwork=validate \
            -var toolchain_script=examples/image-hooks/toolchain-node.sh \
            -var warm_cache_script=examples/image-hooks/warm-npm.sh \
            -var upload_dir=examples/image-hooks image

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck image/*.sh image/hooks/*.sh examples/image-hooks/*.sh scripts/*.sh

